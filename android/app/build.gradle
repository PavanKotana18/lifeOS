apply plugin: 'com.android.application'

// package.json is the authoritative app version. An optional build number can
// distinguish automated artifacts; ordinary local builds remain reproducible.
def lifeosPackage = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def lifeosVersion = lifeosPackage.version
def lifeosVersionMatch = (lifeosVersion =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!lifeosVersionMatch.matches()) {
    throw new GradleException("package.json version must be MAJOR.MINOR.PATCH, got: ${lifeosVersion}")
}
def lifeosMajor = lifeosVersionMatch[0][1].toInteger()
def lifeosMinor = lifeosVersionMatch[0][2].toInteger()
def lifeosPatch = lifeosVersionMatch[0][3].toInteger()
if (lifeosMinor >= 1000 || lifeosPatch >= 1000) {
    throw new GradleException('LifeOS Android versionCode mapping requires MINOR and PATCH below 1000.')
}
def lifeosBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def lifeosVersionCode = lifeosMajor * 1000000 + lifeosMinor * 1000 + lifeosPatch + lifeosBuildNumber
if (lifeosVersionCode <= 0 || lifeosVersionCode > 2100000000) {
    throw new GradleException("Calculated Android versionCode is out of range: ${lifeosVersionCode}")
}

def lifeosReleaseSigningReady =
    ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
     'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].every {
        System.getenv(it)?.trim()
    }
def lifeosDebugSigningReady =
    ['LIFEOS_DEBUG_KEYSTORE_PATH', 'LIFEOS_DEBUG_KEYSTORE_PASSWORD',
     'LIFEOS_DEBUG_KEY_ALIAS', 'LIFEOS_DEBUG_KEY_PASSWORD'].every {
        System.getenv(it)?.trim()
    }
def lifeosPreviewSigningReady =
    ['LIFEOS_PREVIEW_KEYSTORE_PATH', 'LIFEOS_PREVIEW_KEYSTORE_PASSWORD',
     'LIFEOS_PREVIEW_KEY_ALIAS', 'LIFEOS_PREVIEW_KEY_PASSWORD'].every {
        System.getenv(it)?.trim()
    }
def lifeosPreviewSourceCommit = System.getenv('LIFEOS_PREVIEW_SOURCE_COMMIT') ?: ''

android {
    signingConfigs {
        if (lifeosReleaseSigningReady) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
        if (lifeosDebugSigningReady) {
            lifeosDebug {
                storeFile file(System.getenv('LIFEOS_DEBUG_KEYSTORE_PATH'))
                storePassword System.getenv('LIFEOS_DEBUG_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIFEOS_DEBUG_KEY_ALIAS')
                keyPassword System.getenv('LIFEOS_DEBUG_KEY_PASSWORD')
            }
        }
        lifeosPreview {
            if (lifeosPreviewSigningReady) {
                storeFile file(System.getenv('LIFEOS_PREVIEW_KEYSTORE_PATH'))
                storePassword System.getenv('LIFEOS_PREVIEW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIFEOS_PREVIEW_KEY_ALIAS')
                keyPassword System.getenv('LIFEOS_PREVIEW_KEY_PASSWORD')
            }
        }
    }
    namespace "com.lifeos.personal"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lifeos.personal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode lifeosVersionCode
        versionName lifeosVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            if (lifeosDebugSigningReady) {
                signingConfig signingConfigs.lifeosDebug
            } else {
                signingConfig = null
            }
        }
        preview {
            initWith debug
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            debuggable true
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.lifeosPreview
            manifestPlaceholders = [lifeosSourceCommit: lifeosPreviewSourceCommit ?: 'unavailable']
        }
        release {
            if (lifeosReleaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Keep the existing Dev identity strict while allowing its separate preview
// build type to use a dedicated local key. Neither variant falls back to the
// shared Android debug keystore when its own signing inputs are missing.
gradle.taskGraph.whenReady { graph ->
    def lifeosAppProject = project
    def artifactTaskPrefixes = ['assemble', 'package', 'bundle', 'install', 'sign', 'validatesigning']
    def requestedVariants = graph.allTasks.findAll { task ->
        def name = task.name.toLowerCase()
        task.project == lifeosAppProject && artifactTaskPrefixes.any { prefix -> name.startsWith(prefix) }
            && (name.contains('debug') || name.contains('preview'))
    }
    def requestsDebug = requestedVariants.any { it.name.toLowerCase().contains('debug') }
    def requestsPreview = requestedVariants.any { it.name.toLowerCase().contains('preview') }
    if (requestsDebug && !lifeosDebugSigningReady) {
        throw new GradleException('Dev APK signing requires the persistent LIFEOS_DEBUG_KEY_* identity; standard debug signing is disabled.')
    }
    if (requestsPreview && !lifeosPreviewSigningReady) {
        throw new GradleException('Preview APK signing requires its separate LIFEOS_PREVIEW_KEY_* identity.')
    }
    if (requestsPreview && !(lifeosPreviewSourceCommit ==~ /[0-9a-f]{40}/)) {
        throw new GradleException('Preview APK build requires LIFEOS_PREVIEW_SOURCE_COMMIT to identify the exact source commit.')
    }
}

dependencies {
    // Test APK only: no authentication bypass or production test hooks.
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation project(':capacitor-android')
}

apply from: 'capacitor.build.gradle'
