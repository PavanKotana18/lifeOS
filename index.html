<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="color-scheme" content="light dark" />
    <title>LifeOS</title>
    <script>
      const savedAppearance = localStorage.getItem('lifeos-appearance');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialDark = savedAppearance === 'dark' || (savedAppearance !== 'light' && systemDark);
      document.documentElement.classList.toggle('dark', initialDark);
      document.documentElement.style.colorScheme = initialDark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', initialDark ? '#090d16' : '#f8fafc');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
