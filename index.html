<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101712" />
    <meta name="color-scheme" content="light dark" />
    <title>BusyDoo</title>
    <meta name="description" content="Life, in one place." />
    <link rel="icon" href="./lifeos-mark.svg" type="image/svg+xml" />
    <script>
      const savedAppearance = localStorage.getItem('lifeos-appearance');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialDark = savedAppearance === 'dark' || (savedAppearance !== 'light' && systemDark);
      document.documentElement.classList.toggle('dark', initialDark);
      document.documentElement.style.colorScheme = initialDark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', initialDark ? '#101712' : '#FAFAF7');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
