name: LifeOS isolated swipe comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage exact APKs and record provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidates evidence
          download() {
            mkdir -p "candidates/$1"
            for attempt in {1..12}; do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$2/artifacts" --jq '.artifacts[].name' | rg -Fxq "$3"; then
                break
              fi
              sleep 30
            done
            gh run download "$2" -n "$3" -D "candidates/$1"
            find "candidates/$1" -name '*.apk' -print -exec sha256sum {} \; | tee -a evidence/apks.txt
          }
          download main 45623499656 LifeOS-debug-apk
          download reference 45728822022 LifeOS-signed-debug-apk-6457dde6edbd1d78763c6e2827db0318885bcb45
          download navigation 45769131610 LifeOS-signed-debug-apk-dd52dc5e50245bdcb2648baf6e90130585aa4d18
          download combined 45769207864 LifeOS-signed-debug-apk-987923e308c0ce80764f8a1b066c991321987b22
      - run: bash scripts/enable-github-runner-kvm.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 300
          disable-animations: false
          script: node scripts/swipe-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeos-swipe-comparison
          path: evidence/
          if-no-files-found: error

