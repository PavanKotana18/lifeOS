name: LifeOS visual gate isolation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [navigation, combined]
        test: [packagedMandatoryOnboardingScreensAndRestart, retainedTrackNativeFrames]
        include:
          - build: navigation
            run: 45769131610
            sha: dd52dc5e50245bdcb2648baf6e90130585aa4d18
          - build: combined
            run: 45769207864
            sha: 987923e308c0ce80764f8a1b066c991321987b22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage the exact hosted app and test APKs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ matrix.run }}
        run: |
          gh run download "$SOURCE_RUN" -n lifeos-android-test-apks -D android-apks
          sha256sum android-apks/*.apk
          cat > run-isolated-visual.sh <<'SH'
          status=0
          bash scripts/run-android-instrumentation.sh android-apks/app-debug.apk android-apks/app-debug-androidTest.apk qa-visual-evidence || status=$?
          if [ -s qa-visual-evidence/device-profile.txt ] && [ "$(adb -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')" = 1 ]; then
            adb -s emulator-5554 pull /sdcard/Android/data/com.lifeos.personal.debug/files/LifeOS-directed-visual qa-visual-evidence/screenshots || true
          fi
          exit "$status"
          SH
      - run: bash scripts/enable-github-runner-kvm.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_FILTER: com.lifeos.personal.DirectedVisualAcceptanceTest#${{ matrix.test }}
          ANDROID_REQUIRED_TEST: DirectedVisualAcceptanceTest#${{ matrix.test }}
          ANDROID_EXPECTED_TESTS: '1'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 300
          disable-animations: false
          script: bash run-isolated-visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ matrix.build }}-${{ matrix.test }}
          path: qa-visual-evidence/
          if-no-files-found: error
