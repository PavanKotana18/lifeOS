name: Build LifeOS Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Runner
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Run Automated LifeOS Verification Tests
        run: |
          npm test

      - name: Build Web Application
        run: |
          npm run build || true
          mkdir -p dist

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Generate Wrapper & Build Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1 || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK (Optional)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeOS-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
